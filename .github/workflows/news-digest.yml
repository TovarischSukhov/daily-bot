name: News Digest

on:
  schedule:
    - cron: "30 6 * * *"  # 06:30 UTC = 08:30 CEST (summer) / 07:30 CET (winter)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without sending to Slack"
        required: false
        default: "false"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # needed to commit seen.json back to the repo
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so the rebase below works
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .

      - name: Run news digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python -m src.jobs.news --dry-run
          else
            python -m src.jobs.news
          fi

      # Persist the rolling "already covered" state back to the repo so local
      # and scheduled runs share one dedup history. Skipped on dry-run.
      - name: Persist seen.json
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if [ -z "$(git status --porcelain seen.json)" ]; then
            echo "seen.json unchanged; nothing to persist"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git commit -m "chore: update dedup history [skip ci]"
          # Someone (a human, or an overlapping run) may have pushed meanwhile.
          # Rebase onto whatever is on main and retry; -X theirs keeps this run's
          # seen.json, which is the freshest state of the dedup history.
          for attempt in 1 2 3; do
            git pull --rebase -X theirs origin main || { git rebase --abort || true; sleep 5; continue; }
            git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "could not push seen.json after 3 attempts" >&2
          exit 1
